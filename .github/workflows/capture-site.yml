name: Capture site screenshots

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL of the deployed Lovable site'
        required: true
        type: string
      slug:
        description: 'Folder name under data/sites/'
        required: true
        type: string

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install playwright pillow
          playwright install --with-deps chromium

      - name: Capture
        run: |
          python scripts/capture.py "${{ inputs.url }}" "${{ inputs.slug }}"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sites/${{ inputs.slug }}
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Capture screenshots for ${{ inputs.slug }} from ${{ inputs.url }}"
            git push
          fi
