name: Capture site screenshots

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL of the deployed Lovable site'
        required: true
        type: string
      slug:
        description: 'Folder name under data/sites/'
        required: true
        type: string
  push:
    paths:
      - '.capture-queue.txt'

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install playwright pillow
          playwright install --with-deps chromium

      - name: Capture from manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          python scripts/capture.py "${{ inputs.url }}" "${{ inputs.slug }}"

      - name: Capture from queue file
        if: github.event_name == 'push'
        run: |
          if [ ! -f .capture-queue.txt ]; then
            echo "No queue file."; exit 0
          fi
          # Each non-empty, non-# line is: slug url
          while IFS= read -r line || [ -n "$line" ]; do
            line="${line%%#*}"
            line="$(echo "$line" | xargs)"
            [ -z "$line" ] && continue
            SLUG=$(echo "$line" | awk '{print $1}')
            URL=$(echo "$line" | awk '{print $2}')
            if [ -n "$SLUG" ] && [ -n "$URL" ]; then
              echo "→ capturing $SLUG from $URL"
              python scripts/capture.py "$URL" "$SLUG"
            fi
          done < .capture-queue.txt
          : > .capture-queue.txt
          echo "# entries are processed and removed by the workflow" > .capture-queue.txt

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sites .capture-queue.txt
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Auto-capture screenshots ($(date -u +%FT%TZ))"
            git push
          fi
